services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-init:
    image: erp-backend-init:local
    build:
      context: ./backend
      target: builder
    command: >
      sh -c "
        npx medusa db:migrate &&
        npx medusa exec ./src/scripts/bootstrap.ts &&
        npx medusa user -e ${MEDUSA_ADMIN_EMAIL:-admin@aurelia.com} -p ${MEDUSA_ADMIN_PASSWORD} >/dev/null 2>&1 || true &&
        if [ \"${SEED_DEMO_DATA:-false}\" = \"true\" ]; then
          echo 'Seeding demo data...' &&
          npx medusa exec ./src/scripts/seed-aurelia.ts
        fi
      "
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://medusa:medusa@db:5432/medusa?sslmode=disable
      STORE_CORS: ${STORE_CORS:-http://localhost:7358,http://127.0.0.1:7358,http://localhost:8081,http://127.0.0.1:8081,http://localhost:9000,http://127.0.0.1:9000,http://pione:7358,http://pione:8081,http://pione:9000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:9000,http://127.0.0.1:9000,http://pione:8081,http://pione:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:7358,http://127.0.0.1:7358,http://localhost:8081,http://127.0.0.1:8081,http://localhost:9000,http://127.0.0.1:9000,http://pione:7358,http://pione:8081,http://pione:9000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      MEDUSA_FORCE_INSECURE_COOKIES: ${MEDUSA_FORCE_INSECURE_COOKIES:-true}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-admin@aurelia.com}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:?MEDUSA_ADMIN_PASSWORD is required}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-no-reply@aurelia.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Aurelia <invitaciones@mail.aurelia.gleeze.com>}
      MEDUSA_ADMIN_URL: ${MEDUSA_ADMIN_URL:-http://localhost:9000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: erp-backend:local
    build:
      context: ./backend
      target: runner
    command: npm run start
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://medusa:medusa@db:5432/medusa?sslmode=disable
      STORE_CORS: ${STORE_CORS:-http://localhost:7358,http://127.0.0.1:7358,http://localhost:8081,http://127.0.0.1:8081,http://localhost:9000,http://127.0.0.1:9000,http://pione:7358,http://pione:8081,http://pione:9000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:9000,http://127.0.0.1:9000,http://pione:8081,http://pione:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:7358,http://127.0.0.1:7358,http://localhost:8081,http://127.0.0.1:8081,http://localhost:9000,http://127.0.0.1:9000,http://pione:7358,http://pione:8081,http://pione:9000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      MEDUSA_FORCE_INSECURE_COOKIES: ${MEDUSA_FORCE_INSECURE_COOKIES:-true}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-admin@aurelia.com}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:?MEDUSA_ADMIN_PASSWORD is required}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-no-reply@aurelia.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Aurelia <invitaciones@mail.aurelia.gleeze.com>}
      MEDUSA_ADMIN_URL: ${MEDUSA_ADMIN_URL:-http://localhost:9000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: erp-web:local
    build:
      context: .
    ports:
      - "7358:3000"
    env_file:
      - .env.local
    environment:
      - MEDUSA_INTERNAL_BACKEND_URL=http://backend:9000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    depends_on:
      - backend

  pos:
    image: erp-pos:local
    build:
      context: ./pos
      dockerfile: Dockerfile.web
    ports:
      - "8081:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
