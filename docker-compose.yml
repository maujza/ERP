# docker-compose.yml — Full stack orchestration for local development and production
#
# Services and startup order:
#   db → backend-init → backend → web / pos → nginx
#
# To start everything:
#   ./scripts/compose-up.sh        # smart script with selective rebuilds
#   docker compose up --build -d   # rebuild and start all services
#
# Useful individual rebuilds:
#   docker compose up --build backend -d   # rebuild only the Medusa backend
#   docker compose up --build web -d       # rebuild only the Next.js storefront
#
# Ports exposed on the host machine:
#   80 / 443 → public HTTP/HTTPS traffic through Nginx Proxy Manager
#   81 → Nginx Proxy Manager admin UI (localhost only; use an SSH tunnel remotely)
#   5433 / 9000 / 7358 / 8081 → direct service access (localhost only)

services:

  # ── db ──────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 database shared by the backend and backend-init services.
  # Data is persisted in the `postgres_data` named volume (survives container restarts).
  # The healthcheck ensures dependent services only start once Postgres accepts connections.
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    ports:
      - "127.0.0.1:5433:5432"   # localhost only; Nginx does not need database access
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── backend-init ─────────────────────────────────────────────────────────────
  # One-shot initialization container — runs once on every `docker compose up`, then exits.
  # Uses the same image as `backend` but runs migrations and seed scripts instead of the server.
  #
  # What it does (in order):
  #   1. npx medusa db:migrate       — applies any pending database migrations
  #   2. npx medusa exec bootstrap   — creates sales channels, regions, etc. (idempotent)
  #   3. medusa user -e ... -p ...   — creates/updates the admin user (|| true = safe if exists)
  #   4. seed-aurelia.ts             — seeds demo jewelry catalog (only if SEED_DEMO_DATA=true)
  backend-init:
    image: erp-backend-init:local
    build:
      context: ./backend
      target: builder   # "builder" Dockerfile stage includes dev tools like npx
    command: >
      sh -c "
        npx medusa db:migrate &&
        npx medusa exec ./src/scripts/bootstrap.ts &&
        npx medusa user -e ${MEDUSA_ADMIN_EMAIL:-admin@aurelia.com} -p ${MEDUSA_ADMIN_PASSWORD} >/dev/null 2>&1 || true &&
        if [ \"${SEED_DEMO_DATA:-false}\" = \"true\" ]; then
          echo 'Seeding demo data...' &&
          npx medusa exec ./src/scripts/seed-aurelia.ts
        fi
      "
    env_file: ./backend/.env   # reads secrets like JWT_SECRET, COOKIE_SECRET, etc.
    environment:
      NODE_ENV: production
      # Override DATABASE_URL to use the Docker-internal hostname "db" (not localhost)
      DATABASE_URL: postgres://medusa:medusa@db:5432/medusa?sslmode=disable
    depends_on:
      db:
        condition: service_healthy   # wait for Postgres healthcheck before running
    restart: "no"   # run once and exit — do not restart on failure

  # ── backend ──────────────────────────────────────────────────────────────────
  # The Medusa headless commerce API server.
  # Exposes port 9000 for:
  #   - Store API:  http://localhost:9000/store/*
  #   - Admin API:  http://localhost:9000/admin/*
  #   - Admin UI:   http://localhost:9000/app (Medusa's built-in admin dashboard)
  backend:
    image: erp-backend:local
    build:
      context: ./backend
      target: runner   # "runner" stage is a slimmer production image without build tools
    command: npm run start
    ports:
      - "127.0.0.1:9000:9000"
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://medusa:medusa@db:5432/medusa?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped   # restart automatically on crash or host reboot

  # ── web ──────────────────────────────────────────────────────────────────────
  # The Next.js storefront (customer-facing shop + backoffice UI).
  # Runs a production build — there is NO hot reload. After changing storefront code,
  # rebuild with: docker compose up --build web -d
  #
  # MEDUSA_INTERNAL_BACKEND_URL is the Docker-internal hostname so Next.js's
  # server-side /api/medusa proxy rewrite reaches the backend without going
  # through the host machine's localhost.
  web:
    image: erp-web:local
    build:
      context: ./storefront
    ports:
      - "127.0.0.1:7358:3000"   # direct access remains available from the host
    env_file: ./storefront/.env
    environment:
      # Docker-internal URL used by Next.js's server-side /api/medusa proxy rewrite
      MEDUSA_INTERNAL_BACKEND_URL: http://backend:9000
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"   # opt out of Next.js anonymous usage telemetry
    restart: unless-stopped
    depends_on:
      - backend

  # ── pos ──────────────────────────────────────────────────────────────────────
  # The Expo/React Native point-of-sale app compiled for web.
  # Accessible at http://localhost:8081
  pos:
    image: erp-pos:local
    build:
      context: ./pos
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8081:3000"
    restart: unless-stopped
    depends_on:
      - backend

  # ── nginx ────────────────────────────────────────────────────────────────────
  # Public reverse proxy and TLS certificate manager for the ERP services.
  # Configure proxy hosts using Docker service names as upstreams:
  #   storefront domain  → web:3000
  #   backoffice domain  → backend:9000
  #   POS domain         → pos:3000
  nginx:
    image: jc21/nginx-proxy-manager:2.11.3
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    environment:
      DB_MYSQL_HOST: nginx-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${NGINX_DB_PASSWORD:?set NGINX_DB_PASSWORD in the root .env file}
      DB_MYSQL_NAME: npm
      DISABLE_IPV6: "true"
    volumes:
      - nginx_data:/data
      - nginx_letsencrypt:/etc/letsencrypt
    depends_on:
      nginx-db:
        condition: service_healthy
      backend:
        condition: service_started
      web:
        condition: service_started
      pos:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx-db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: npm
      MARIADB_USER: npm
      MARIADB_PASSWORD: ${NGINX_DB_PASSWORD:?set NGINX_DB_PASSWORD in the root .env file}
      MARIADB_ROOT_PASSWORD: ${NGINX_DB_PASSWORD:?set NGINX_DB_PASSWORD in the root .env file}
    volumes:
      - nginx_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  # Named volume — stores Postgres data files outside the container so data
  # persists across `docker compose down` and container rebuilds.
  postgres_data:
  nginx_data:
  nginx_letsencrypt:
  nginx_db_data:
