services:
  prometheus:
    image: prom/prometheus:v3.8.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - telegraf
      - blackbox-exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${MONITORING_ADMIN_USER:?set MONITORING_ADMIN_USER in infra/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${MONITORING_ADMIN_PASSWORD:?set MONITORING_ADMIN_PASSWORD in infra/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - default
      - platform
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  node-exporter:
    image: prom/node-exporter:v1.10.2
    hostname: aurora
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|ramfs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /run/udev:/run/udev:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  telegraf:
    image: telegraf:1.36.3
    user: root
    group_add:
      - "${DOCKER_GID:-988}"
    command:
      - telegraf
      - --config
      - /etc/telegraf/telegraf.conf
    volumes:
      - ./configs/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./configs/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - default
      - platform
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  portainer:
    image: portainer/portainer-ce:2.33.6-alpine
    command:
      - --admin-password
      - ${PORTAINER_ADMIN_PASSWORD_HASH:?set PORTAINER_ADMIN_PASSWORD_HASH in infra/.env}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - default
      - platform
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  portainer-init:
    image: curlimages/curl:8.12.1
    environment:
      MONITORING_ADMIN_USER: ${MONITORING_ADMIN_USER:?set MONITORING_ADMIN_USER in infra/.env}
      MONITORING_ADMIN_PASSWORD: ${MONITORING_ADMIN_PASSWORD:?set MONITORING_ADMIN_PASSWORD in infra/.env}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        auth() {
          curl --insecure --silent --fail \
            --header 'Content-Type: application/json' \
            --data "{\"username\":\"$$1\",\"password\":\"$$MONITORING_ADMIN_PASSWORD\"}" \
            https://portainer:9443/api/auth
        }

        for attempt in $$(seq 1 60); do
          if auth "$$MONITORING_ADMIN_USER" >/dev/null 2>&1; then
            exit 0
          fi

          response="$$(auth admin 2>/dev/null || true)"
          jwt="$$(printf '%s' "$$response" | sed -n 's/.*"jwt":"\([^"]*\)".*/\1/p')"
          if [ -n "$$jwt" ]; then
            curl --insecure --silent --fail --request PUT \
              --header "Authorization: Bearer $$jwt" \
              --header 'Content-Type: application/json' \
              --data '{"InternalAuthSettings":{"RequiredPasswordLength":11}}' \
              https://portainer:9443/api/settings >/dev/null
            curl --insecure --silent --fail --request PUT \
              --header "Authorization: Bearer $$jwt" \
              --header 'Content-Type: application/json' \
              --data "{\"Username\":\"$$MONITORING_ADMIN_USER\",\"Role\":1,\"newPassword\":\"$$MONITORING_ADMIN_PASSWORD\"}" \
              https://portainer:9443/api/users/1 >/dev/null
            exit 0
          fi

          sleep 1
        done

        echo "Portainer initialization timed out" >&2
        exit 1
    depends_on:
      - portainer
    restart: "no"

networks:
  platform:
    name: erp_platform
    external: true

volumes:
  prometheus_data:
    name: erp_prometheus_data
    external: true
  grafana_data:
    name: erp_grafana_data
    external: true
  portainer_data:
    name: erp_portainer_data
    external: true
