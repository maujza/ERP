# CI-only inventory for the drift-check step in .github/workflows/deploy.yml.
#
# The GitHub Actions self-hosted runner already lives on the VPS being
# managed by site.yml, so it doesn't need to SSH into itself (and shouldn't
# need the operator's root SSH key to do it). ansible_connection=local runs
# the playbook directly on the box; --become (passed on the command line)
# elevates via the scoped sudoers rule from roles/runner instead.
#
# Same group name ("erp") as inventory.ini so site.yml's `hosts: erp` matches.
[erp]
prod ansible_connection=local

[erp:vars]
ansible_python_interpreter=/usr/bin/python3
