---
# This role assumes the GitHub Actions self-hosted runner service is already
# installed and registered under {{ runner_user }} (a manual one-time step —
# see deploy/ansible/README.md). It only grants that existing user the access
# it needs to drive deploys, and configures the host-level pieces CI relies on
# (the local registry's insecure-registries entry, npm/Playwright caches).

# ansible.posix.acl would be the declarative way to do this, but every other
# role in this playbook sticks to ansible.builtin only, so these use
# `setfacl` directly via the command module instead of adding a collection
# dependency. Re-running setfacl with the same entry is a no-op.
- name: Allow the runner user to traverse /root (not list it, not read other files there)
  ansible.builtin.command: setfacl -m u:{{ runner_user }}:x /root
  changed_when: false

- name: Grant the runner user full access to the app checkout
  ansible.builtin.command: setfacl -R -m u:{{ runner_user }}:rwx {{ app_dir }}
  changed_when: false

- name: Default-grant the same access for files created later (git pull, build artifacts)
  ansible.builtin.command: setfacl -R -d -m u:{{ runner_user }}:rwx {{ app_dir }}
  changed_when: false

# Narrower than the rwx grant above: CI only ever greps credentials out of
# these (see deploy.yml's e2e steps) or doesn't touch them at all — never
# writes or executes them. Without this override they'd inherit rwx from the
# recursive grant, which both over-grants write access to production secrets
# and widens the ACL mask enough that the *.env.j2 templates' `mode: "0644"`
# never matches reality, making those render tasks falsely report "changed"
# forever.
- name: Narrow the runner's access on the rendered .env files to read-only
  ansible.builtin.command: setfacl -m u:{{ runner_user }}:r {{ item }}
  loop:
    - "{{ app_dir }}/.env"
    - "{{ app_dir }}/backend/.env"
    - "{{ app_dir }}/storefront/.env"
    - "{{ app_dir }}/infra/.env"
  changed_when: false

- name: Ensure the runner user's .ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ runner_user }}/.ssh"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0700"

# A separate copy, not an ACL grant on root's own deploy_key_path: git/ssh's
# client-side permission check rejects any private key with group/other bits
# set, regardless of whether the access is really scoped to a named ACL entry
# (it only looks at the legacy mode bits, which setfacl widens to fit the
# grant) — sharing the *same* file broke root's own "Clone or update the
# repository" task the moment this role's ACL grant ran. A plain copy, owned
# solely by the runner at a clean 0600, sidesteps that entirely. Re-rendered
# from the same vault secret on every run, so key rotation stays in sync
# without needing the ACL trick.
- name: Install the runner's own copy of the deploy key
  ansible.builtin.copy:
    content: "{{ vault_github_deploy_key }}"
    dest: "/home/{{ runner_user }}/.ssh/erp_deploy"
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0600"
  no_log: true

- name: Configure the runner user's SSH to use its own deploy key copy for GitHub
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ runner_user }}/.ssh/config"
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0600"

- name: Mark the app checkout as a safe.directory for the runner user (it's root-owned, runner isn't root)
  ansible.builtin.command: >-
    git config --global --replace-all safe.directory {{ app_dir }}
  become: true
  become_user: "{{ runner_user }}"
  changed_when: false

- name: Ensure the CI npm/Playwright host caches exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ npm_cache_dir }}"
    - "{{ playwright_cache_dir }}"

- name: Allow the Docker daemon to push/pull the local registry over plain HTTP
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  register: docker_daemon_config

- name: Restart Docker to pick up the insecure-registries change
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_daemon_config.changed

# The CI pipeline's drift-check step (deploy.yml) runs this playbook with
# --check --diff from the runner itself, rather than over SSH from an
# operator's laptop — so ansible-playbook needs to exist locally on this box.
- name: Install ansible-core (needed locally for the CI drift-check step)
  ansible.builtin.apt:
    name: ansible-core
    state: present

# `validate` runs visudo against the rendered file (in a temp location) and
# only lets `template` move it into place if validation passes — a single
# atomic, check-mode-safe step, no separate render-then-move dance needed.
- name: Render the sudoers rule that lets the runner invoke ansible-playbook as root
  ansible.builtin.template:
    src: github-runner-ansible.j2
    dest: /etc/sudoers.d/github-runner-ansible
    mode: "0440"
    validate: "visudo -cf %s"
