---
# Brings infra/.env (nginx-proxy-manager + monitoring stack secrets) under
# Ansible, closing the one .env in this repo that was still hand-edited on
# the VPS — historical accident (infra/monitoring predates Ansible existing
# in this repo at all), not a deliberate choice; see docs/db-restore-runbook.md
# and the Repowise decision recorded for this role.

# no_log: true — same reasoning as roles/app's root.env.j2/backend.env.j2:
# this template embeds real secrets (NGINX DB password, Grafana/Portainer
# admin credentials, the Resend API key), and a CI drift-check running with
# --diff would otherwise print them straight into the GitHub Actions log.
- name: Render infra/.env
  ansible.builtin.template:
    src: infra.env.j2
    dest: "{{ app_dir }}/infra/.env"
    mode: "0644"
  no_log: true
  register: infra_env

# Only recreated when infra/.env actually changed — these are the 2 compose
# projects that read it (registry_compose does not, see scripts/compose-up.sh).
# Mirrors how roles/backup only restarts wg-quick@wg0 when its own config
# changes, rather than unconditionally on every run.
- name: Recreate nginx-proxy-manager with the new infra/.env
  ansible.builtin.command: >-
    docker compose --project-name erp-infra
    --env-file {{ app_dir }}/infra/.env
    --file {{ app_dir }}/infra/networking/nginx-proxy-manager/compose.yml
    up -d
  when: infra_env.changed and not ansible_check_mode
  changed_when: true

# telegraf (in the monitoring compose project) needs the host's real
# docker.sock group id to read container stats without running as root —
# same value scripts/compose-up.sh computes via `stat -c '%g'` each time,
# rather than hardcoding a GID that varies by distro/install.
- name: Look up the docker.sock group id
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_sock
  when: infra_env.changed and not ansible_check_mode

- name: Recreate the monitoring stack with the new infra/.env
  ansible.builtin.command: >-
    docker compose --project-name erp-monitoring
    --env-file {{ app_dir }}/infra/.env
    --file {{ app_dir }}/infra/monitoring/compose.yml
    up -d
  environment:
    DOCKER_GID: "{{ docker_sock.stat.gid }}"
  when: infra_env.changed and not ansible_check_mode
  changed_when: true

# ── Nginx Proxy Manager routing + TLS ────────────────────────────────────
# NPM's proxy hosts and custom certs live only in its own DB volume, never in
# a rendered file — so a bare-box reprovision (or migrating to a new VPS) used
# to come up with no TLS and no routing for the production domain. These tasks
# declare them idempotently via the NPM API (provision-npm.py), so the routing
# is reproducible like everything else. Runs on every deploy, not just when
# infra/.env changed, so a drifted/deleted proxy host is reconciled.
#
# Gated on vault_npm_secret being set: a control node whose vault doesn't carry
# the NPM/CF-origin secrets (e.g. an operator restoring backend/.env from a
# pre-NPM vault) skips NPM provisioning entirely rather than failing on an
# empty-password API auth. NPM is already configured on the live box, so
# skipping is safe; only a from-scratch reprovision needs these vars present.
- name: Wait for the Nginx Proxy Manager API to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:81/api/"
    status_code: [200, 401]
  register: npm_api
  retries: 20
  delay: 3
  until: npm_api.status in [200, 401]
  when: not ansible_check_mode and (vault_npm_secret | default('')) | length > 0

# Staged to disk (not piped) because provision-npm.py reads them as files and
# runs openssl against the cert to detect rotation. 0600, removed right after.
- name: Stage the Cloudflare Origin certificate + key for NPM
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: "0600"
  # default('') so the loop templates cleanly under `ansible-playbook --check`
  # (the CI drift-check) even if that run's vault lacks these vars — Ansible
  # builds the loop before evaluating `when`, so an undefined var here would
  # warn despite the task being skipped in check mode. Real runs have the vars.
  loop:
    - { content: "{{ vault_cf_origin_cert | default('') }}", dest: /root/.npm-origin-cert.pem }
    - { content: "{{ vault_cf_origin_key | default('') }}", dest: /root/.npm-origin-key.pem }
  no_log: true
  when: not ansible_check_mode and (vault_npm_secret | default('')) | length > 0

- name: Provision NPM certificate + proxy hosts (idempotent)
  ansible.builtin.command:
    cmd: python3 {{ app_dir }}/infra/networking/nginx-proxy-manager/provision-npm.py
  environment:
    NPM_IDENTITY: "{{ npm_admin_identity }}"
    NPM_SECRET: "{{ vault_npm_secret }}"
    NPM_CERT_NAME: "{{ npm_cert_name }}"
    NPM_CERT_FILE: /root/.npm-origin-cert.pem
    NPM_KEY_FILE: /root/.npm-origin-key.pem
    NPM_HOSTS_JSON: "{{ npm_proxy_hosts | to_json }}"
  register: npm_provision
  # no_log because the environment carries NPM_SECRET; the result is surfaced
  # by the debug task below, which only prints the script's resource lines.
  no_log: true
  changed_when: >-
    'created' in npm_provision.stdout
    or 'updated' in npm_provision.stdout
    or 're-uploaded' in npm_provision.stdout
  when: not ansible_check_mode and (vault_npm_secret | default('')) | length > 0

- name: Show NPM provisioning result
  ansible.builtin.debug:
    var: npm_provision.stdout_lines
  when: not ansible_check_mode and (vault_npm_secret | default('')) | length > 0 and npm_provision.stdout_lines is defined

- name: Remove the staged certificate material
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.npm-origin-cert.pem
    - /root/.npm-origin-key.pem
  when: not ansible_check_mode and (vault_npm_secret | default('')) | length > 0
