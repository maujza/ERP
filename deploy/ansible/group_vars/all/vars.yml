# Non-secret configuration. Secrets live in vault.yml (Ansible Vault).
app_dir: /root/ERP
app_repo: git@github.com:aikirias/ERP.git
app_branch: main
deploy_key_path: /root/.ssh/erp_deploy

# Host-bound ports Nginx Proxy Manager forwards to over the shared
# erp_platform Docker network (see docs/deploy.md). Used below only for the
# on-box smoke checks (curl against localhost) and the UFW rules — NOT for
# the public-facing URLs, which go through the real domains over HTTPS.
public_host: "159.223.101.210"
storefront_port: 80
backend_port: 9000

# Docker apt repo architecture (handles both x86 VPS and ARM Raspberry Pi).
deb_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# Public-facing URLs — served over real HTTPS via Nginx Proxy Manager, not
# directly off public_host/storefront_port/backend_port above (see
# docs/deploy.md's "Arquitectura de producción" / Proxy Host table).
storefront_origin: "https://aurelia.gleeze.com"
backend_url: "https://backoffice.aurelia.gleeze.com"
pos_origin: "https://pos.aurelia.gleeze.com"

medusa_admin_email: admin@aurelia.com
medusa_force_insecure_cookies: false
seed_demo_data: false

whatsapp_number: ""
shipping_standard_ars: 3900
shipping_express_ars: 7200

# CI: GitHub Actions self-hosted runner (installed/registered manually, see
# deploy/ansible/README.md) and the local Docker registry it pushes to.
runner_user: github-runner
registry_port: 5000
npm_cache_dir: /root/.npm-ci-cache
playwright_cache_dir: /root/.cache/ms-playwright
