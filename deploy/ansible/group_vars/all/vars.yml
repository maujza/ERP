# Non-secret configuration. Secrets live in vault.yml (Ansible Vault).
app_dir: /root/ERP
app_repo: git@github.com:aikirias/ERP.git
app_branch: main
deploy_key_path: /root/.ssh/erp_deploy

# Host-bound ports Nginx Proxy Manager forwards to over the shared
# erp_platform Docker network (see docs/deploy.md). Used below only for the
# on-box smoke checks (curl against localhost) and the UFW rules — NOT for
# the public-facing URLs, which go through the real domains over HTTPS.
public_host: "159.223.101.210"
storefront_port: 80
backend_port: 9000

# Docker apt repo architecture (handles both x86 VPS and ARM Raspberry Pi).
deb_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# Public-facing URLs — served over real HTTPS via Nginx Proxy Manager, not
# directly off public_host/storefront_port/backend_port above (see
# docs/deploy.md's "Arquitectura de producción" / Proxy Host table).
storefront_origin: "https://aurorapormayor.com"
backend_url: "https://backoffice.aurorapormayor.com"
pos_origin: "https://pos.aurorapormayor.com"

medusa_admin_email: admin@aurorapormayor.com
medusa_force_insecure_cookies: false
seed_demo_data: false

whatsapp_number: ""
shipping_standard_ars: 3900
shipping_express_ars: 7200

# CI: GitHub Actions self-hosted runner (installed/registered manually, see
# deploy/ansible/README.md) and the local Docker registry it pushes to.
runner_user: github-runner
registry_port: 5000
npm_cache_dir: /root/.npm-ci-cache
playwright_cache_dir: /root/.cache/ms-playwright

# Off-site DB backups (see docs/db-restore-runbook.md). Two independent
# pools, never mixed: "merge" (every deploy, local-only, never touches the
# network) and "scheduled" (this interval, mirrored to the NAS). Retention is
# by file age (days), not file count — the only unit that stays meaningful
# regardless of how often a deploy happens or how nas_backup_interval_hours
# changes later.
merge_backup_retention_days: 3
nas_backup_retention_days: 10
nas_backup_interval_hours: 6
# Recipients for backup-db.sh's failure alert (scripts/backup-db.sh,
# notify_failure) — comma-separated, sent via the Resend credentials already
# in backend/.env. Not a secret, same criterion as public_host below.
backup_alert_email: "alekwiek@gmail.com,maurojzalazar@gmail.com"

# WireGuard split-tunnel into the operator's home LAN, where the backup NAS
# lives — set up manually first (see deploy/ansible/README.md's "First-time
# setup" for the WireGuard peer + DSM rsync account steps), then automated
# here. wg_allowed_ips must never include 0.0.0.0/0 — this peer only needs
# the tunnel subnet and the home LAN, not all of the VPS's own traffic.
wg_vps_tunnel_address: "10.8.0.5/32"
wg_allowed_ips: "10.8.0.0/24,192.168.0.0/24"

# Synology DSM rsync daemon account (not SSH — see docs/db-restore-runbook.md
# for why). nas_backup_module is the DSM shared folder exposed to that
# account; "merge/" and "scheduled/" subfolders under it map 1:1 to the two
# local pools above.
nas_backup_host: "192.168.0.95"
nas_backup_module: "vps-aurora-backup"
nas_backup_user: "erp-backup"

# infra/.env (nginx-proxy-manager + monitoring stack) — see
# deploy/ansible/roles/infra/. Not secret, same criterion as the rest of
# this file's plaintext operational config.
monitoring_admin_user: "aurora"
# Recipients for Grafana's alert contact point (resend-email). Comma-
# separated like backup_alert_email above — the infra role's template
# converts to Grafana's expected ";"-separated format.
monitoring_alert_email: "alekwiek@gmail.com,maurojzalazar@gmail.com"

# Nginx Proxy Manager routing, provisioned idempotently by roles/infra via
# infra/networking/nginx-proxy-manager/provision-npm.py (the NPM admin
# password + Cloudflare Origin cert/key are secrets in vault.yml). These are
# the public-facing hosts that terminate the CF Origin cert and forward to the
# app containers by their compose service name over the erp_platform network.
# Admin/monitoring panels (grafana/portainer/npm) are deliberately NOT here —
# they stay tunnel-only (ssh -L), not exposed on the public domain.
npm_admin_identity: "admin@aurorapormayor.com"
npm_cert_name: "aurorapormayor.com (CF Origin)"
npm_proxy_hosts:
  - { domain: "aurorapormayor.com", forward_host: "web", forward_port: 3000 }
  - { domain: "backoffice.aurorapormayor.com", forward_host: "backend", forward_port: 9000 }
  - { domain: "pos.aurorapormayor.com", forward_host: "pos", forward_port: 3000 }
