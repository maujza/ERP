---
- name: Deploy the Aurelia ERP stack
  hosts: erp
  become: false
  gather_facts: true
  roles:
    - docker
    - firewall
    - app
    - medusa
    # infra renders infra/.env before runner narrows that file's ACL to
    # read-only — must stay ahead of runner in this list, same reasoning as
    # app/medusa running before runner for backend/.env and storefront/.env.
    - infra
    - runner
    - backup
