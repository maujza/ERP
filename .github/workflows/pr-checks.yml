name: PR checks (lint + unit tests)

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: [self-hosted, vps]
    # Same base image as backend/Dockerfile and storefront/Dockerfile — the
    # runner host itself has no Node installed (everything here runs
    # dockerized), so the whole job runs inside this container instead.
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # The container is fresh on every run, so without this npm re-downloads
      # every package from scratch each time. Keyed on both lockfiles so a
      # change to either invalidates it.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: /root/.npm
          key: npm-${{ hashFiles('backend/package-lock.json', 'storefront/package-lock.json') }}

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Backend unit tests
        run: npm run test:unit
        working-directory: backend

      - name: Install storefront dependencies
        run: npm ci
        working-directory: storefront

      - name: Storefront lint
        run: npm run lint
        working-directory: storefront

      - name: Storefront unit tests
        run: npm run test:run
        working-directory: storefront
