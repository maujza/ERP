name: Build, test in staging, promote to prod

# workflow_dispatch lets this run be exercised manually (repeatedly, without
# waiting for a real push). Kept intentionally, not just a leftover from
# validating the pipeline: it carries the same permissions as a push to
# main (no extra risk) and is the way to deliberately re-trigger a deploy
# to exercise the automatic rollback path without crafting a broken commit.
on:
  push:
    branches:
      - main
    # Doc/dev-tooling-only pushes (CLAUDE.md, docs/, *.md anywhere, .claude/,
    # .devcontainer/) skip the whole build+staging+promote pipeline — nothing
    # here can affect a running deploy. workflow_dispatch below is unaffected
    # by this filter, so a skipped commit can still be deployed manually if
    # ever needed.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".devcontainer/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, vps]
    env:
      # promote-to-prod.sh / rollback-prod.sh / infra-healthcheck.sh /
      # production-smoke.sh must run against the persistent clone whose
      # directory identity ("erp" by default project naming) is what's
      # actually running prod — not the runner's default checkout workspace.
      DEPLOY_DIR: /root/ERP
      # Must match the name declared in docker-compose.staging.yml's
      # `networks.default.name`. The 3 ad-hoc test containers below join
      # this network instead of the host's, so they can reach staging's
      # services by name but have no route at all to prod's ports on this
      # same self-hosted runner — see CHANGELOG.md.
      STAGING_NETWORK: erp-staging-net
    steps:
      - name: Sync the prod checkout to this commit
        run: |
          cd "$DEPLOY_DIR"
          git fetch origin "$GITHUB_SHA"
          git checkout --force "$GITHUB_SHA"
          echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Warn-only: compares deploy/ansible/ against the live server's actual
      # state and flags drift without blocking the deploy or applying
      # anything. Unlike the app deploy (staged + auto-rollback), infra
      # changes here touch firewall/sudoers/Docker daemon with no safety net
      # of their own — auto-applying them unattended on every push is a much
      # bigger blast radius than a bad app image, so fixing real drift stays
      # a deliberate, manual `ansible-playbook site.yml --ask-vault-pass`
      # from an operator's laptop. See CHANGELOG.md.
      - name: Check for infrastructure drift (Ansible, warn-only)
        working-directory: /root/ERP
        continue-on-error: true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_VAULT_FILE: ${{ secrets.ANSIBLE_VAULT_FILE }}
        run: |
          # Reads infra/.env directly — the same RESEND_API_KEY/RESEND_FROM/
          # MONITORING_ALERT_EMAIL already wired to Grafana's alert contact
          # point (deploy/ansible/roles/infra/). Degrades to just the
          # ::warning:: below if infra/.env doesn't have these set yet
          # (e.g. before that role's first real apply) — never fails the
          # step itself. Body is the same text as the ::warning:: plus a
          # link to this run, deliberately never the raw $output below —
          # no need to reason about whether some future no_log-less task's
          # diff content would be safe to email.
          notify_drift() {
            local message="$1"
            local infra_env=/root/ERP/infra/.env
            local api_key from to_csv
            api_key="$(sed -n 's/^RESEND_API_KEY=//p' "$infra_env" 2>/dev/null | tail -1)"
            from="$(sed -n 's/^RESEND_FROM=//p' "$infra_env" 2>/dev/null | tail -1)"
            to_csv="$(sed -n 's/^MONITORING_ALERT_EMAIL=//p' "$infra_env" 2>/dev/null | tail -1 | tr ';' ',')"
            if [ -z "$api_key" ] || [ -z "$to_csv" ]; then
              return 0
            fi
            local run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            RESEND_API_KEY="$api_key" RESEND_FROM="$from" \
              /root/ERP/scripts/send-resend-mail.sh "$to_csv" "Infrastructure drift-check: $message" \
              "$message<br><br><a href=\"$run_url\">$run_url</a>" \
              || echo "::warning::Failed to send the drift-check alert mail itself"
          }

          vault_pass_file="$(mktemp)"
          vault_file="deploy/ansible/group_vars/all/vault.yml"
          trap 'rm -f "$vault_pass_file" "$vault_file"' EXIT
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$vault_pass_file"
          chmod 600 "$vault_pass_file"
          printf '%s' "$ANSIBLE_VAULT_FILE" > "$vault_file"
          chmod 600 "$vault_file"

          ansible_exit=0
          output="$(sudo ansible-playbook \
            -i deploy/ansible/inventory.ci.ini \
            --check --diff --become \
            --vault-password-file "$vault_pass_file" \
            deploy/ansible/site.yml 2>&1)" || ansible_exit=$?
          echo "$output"

          # Isolate the actual PLAY RECAP line ("<host> : ok=.. changed=.. ...")
          # rather than grepping "changed=" anywhere in the output — and treat
          # its absence as its own signal. Without this, a vault password
          # mismatch, broken sudoers rule, or playbook syntax error that kills
          # ansible-playbook before it reaches the recap left `changed` empty,
          # which silently read as "no drift" — the exact failure this check
          # exists to catch, going unnoticed by the check itself.
          #
          # Matches the recap's actual field structure (": ok=N changed=N
          # unreachable=N failed=N"), not a guessed hostname shape — the
          # previous "^(localhost|[0-9.]+)" pattern never matched this repo's
          # real host alias ("prod", from inventory.ci.ini), so this check
          # silently reported "did not complete" on every single run
          # regardless of the real outcome, confirmed by manually replaying
          # this exact step against the live VPS.
          recap="$(printf '%s' "$output" | grep -E ': ok=[0-9]+ +changed=[0-9]+ +unreachable=[0-9]+ +failed=[0-9]+' | tail -1)"

          if [ -z "$recap" ]; then
            message="Infrastructure drift-check did not complete (ansible-playbook exited $ansible_exit before producing a recap) — drift status for this run is UNKNOWN, not necessarily clean. Check the log above (likely a vault password mismatch, sudoers issue, or playbook syntax error) and verify manually with 'ansible-playbook site.yml --check --diff --ask-vault-pass'."
            echo "::warning::$message"
            notify_drift "$message"
            exit 0
          fi

          changed="$(printf '%s' "$recap" | grep -oP 'changed=\K[0-9]+')"
          failed="$(printf '%s' "$recap" | grep -oP 'failed=\K[0-9]+')"
          unreachable="$(printf '%s' "$recap" | grep -oP 'unreachable=\K[0-9]+')"

          if [ "${failed:-0}" -gt 0 ] || [ "${unreachable:-0}" -gt 0 ]; then
            message="Infrastructure drift-check ran but $failed task(s) failed / $unreachable host(s) were unreachable during the dry-run — its result for this run can't be trusted as 'no drift'. Check the log above and run 'ansible-playbook site.yml --check --diff --ask-vault-pass' manually."
            echo "::warning::$message"
            notify_drift "$message"
          elif [ "${changed:-0}" -gt 0 ]; then
            message="Infrastructure drift detected — $changed task(s) in deploy/ansible would change the live server. Review the log above and run 'ansible-playbook site.yml --ask-vault-pass' from your laptop if the change is expected."
            echo "::warning::$message"
            notify_drift "$message"
          fi

      # If a previous run was cancelled (or the runner crashed) before
      # reaching "Tear down staging", the erp-staging project's containers
      # and anonymous db volume survive — the next run's `up -d db` then
      # reuses that stale database, with an admin user/password from
      # whatever ran before, instead of a clean ephemeral stack. Tearing
      # down defensively here guarantees every run starts from zero.
      - name: Clean up any leftover staging stack from a previous run
        working-directory: /root/ERP
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: docker compose --project-name erp-staging -f docker-compose.staging.yml down -v --remove-orphans

      - name: Build and push backend/backend-init/pos (no env baked in, build-once-promote)
        working-directory: /root/ERP
        run: |
          for name in backend backend-init pos; do
            ./scripts/ci-build-and-push.sh "$name" "$TAG"
          done

      - name: Start staging database
        working-directory: /root/ERP
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: docker compose --project-name erp-staging -f docker-compose.staging.yml up -d db

      - name: Run staging migrations and bootstrap
        working-directory: /root/ERP
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: docker compose --project-name erp-staging -f docker-compose.staging.yml run --rm backend-init

      - name: Start staging backend
        working-directory: /root/ERP
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: docker compose --project-name erp-staging -f docker-compose.staging.yml up -d backend

      - name: Wait for staging backend to be ready
        run: |
          for i in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9100/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Staging backend did not become ready in time" >&2
          exit 1

      - name: Build and push web (staging-flavored env)
        working-directory: /root/ERP
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: |
          ./scripts/sync-medusa-env.sh --project erp-staging
          ./scripts/ci-build-and-push.sh web "$TAG"

      - name: Start staging web and pos
        working-directory: /root/ERP
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: docker compose --project-name erp-staging -f docker-compose.staging.yml up -d web pos

      # The runner host has no Node installed (everything here runs
      # dockerized) — these steps run inside a node:20 container instead,
      # with /root/ERP bind-mounted so npm ci's node_modules and the
      # Playwright browser cache persist on the host between steps/runs.
      #
      # Exception to $STAGING_NETWORK below (see CHANGELOG.md): an A/B test
      # confirmed @medusajs/test-utils' MedusaTestRunner (inApp: true, used
      # by every integration-tests/http/*.spec.ts suite) reliably hangs on
      # its Postgres connection under the custom bridge network — 60s
      # KnexTimeoutErrors on every spec file — even though a manual repro of
      # DNS/raw TCP/pg.Client connect+create-database all succeeded instantly
      # over that same network from inside the same container. Root cause
      # not fully isolated; staying on --network host here, kept safe by
      # using staging's own host-published db port 5532 (distinct from
      # prod's 5433) and by this step making no HTTP calls at all (no
      # BACKEND_URL/ADMIN_BASE_URL — the class of bug that motivated
      # $STAGING_NETWORK in the first place doesn't apply to this step).
      # "Backend admin e2e" and "Storefront e2e" below stay on
      # $STAGING_NETWORK and pass cleanly, confirming the isolation itself
      # is sound for steps that hit the already-running staging backend over
      # HTTP rather than booting their own in-process app.
      - name: Backend integration tests against staging
        run: |
          docker rm -f ci-backend-integration-tests 2>/dev/null || true
          docker run --rm --network host --name ci-backend-integration-tests \
            -v /root/ERP:/work -w /work/backend \
            -v /root/.cache/ms-playwright:/root/.cache/ms-playwright \
            -v /root/.npm-ci-cache:/root/.npm \
            -e DATABASE_URL=postgres://medusa:medusa@localhost:5532/medusa?sslmode=disable \
            -e DB_HOST=localhost \
            -e DB_PORT=5532 \
            -e DB_USERNAME=medusa \
            -e DB_PASSWORD=medusa \
            node:20-bookworm-slim \
            bash -c "npm ci --legacy-peer-deps && npm run test:integration:modules && npm run test:integration:http"

      # backend-init creates the staging admin user from MEDUSA_ADMIN_EMAIL/
      # MEDUSA_ADMIN_PASSWORD in backend/.env (not the "supersecret" fallback
      # the e2e suites default to). --env-file loads that file through
      # Docker's own dotenv-style parser (same mechanism docker-compose uses
      # for backend-init/backend, so the value is guaranteed identical to the
      # one used to create the user) — not bash `source`, which fails on
      # RESEND_FROM's unquoted "<...>" value. The two vars are remapped to
      # ADMIN_EMAIL/ADMIN_PASSWORD inside the container, the names the e2e
      # suites actually read.
      - name: Backend admin e2e against staging
        working-directory: /root/ERP
        run: |
          docker rm -f ci-backend-e2e 2>/dev/null || true
          docker run --rm --network "$STAGING_NETWORK" --name ci-backend-e2e \
            -v /root/ERP:/work -w /work/backend \
            -v /root/.cache/ms-playwright:/root/.cache/ms-playwright \
            -v /root/.npm-ci-cache:/root/.npm \
            --env-file backend/.env \
            -e DATABASE_URL=postgres://medusa:medusa@db:5432/medusa?sslmode=disable \
            -e ADMIN_BASE_URL=http://backend:9000 \
            -e CI=true \
            node:20-bookworm-slim \
            bash -c 'export ADMIN_EMAIL="$MEDUSA_ADMIN_EMAIL" ADMIN_PASSWORD="$MEDUSA_ADMIN_PASSWORD"; npx playwright install --with-deps chromium && npm run test:e2e'

      # BACKEND_URL is required by storefront/e2e/_customer.ts (no fallback —
      # see CHANGELOG.md: a missing value here previously defaulted to
      # localhost:9000, which on this self-hosted runner is prod's own
      # backend port, not staging's). Must point at staging's backend,
      # distinct from BASE_URL (the storefront under test). --env-file
      # storefront/.env (synced for staging two steps ago, by "Build and
      # push web") supplies NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY —
      # _customer.ts's own fallback reads storefront/.env.development
      # instead, which sync-medusa-env.sh --project never touches, so
      # without this it sends a stale (likely prod) key staging's
      # freshly-bootstrapped database has never seen.
      - name: Storefront e2e against staging
        working-directory: /root/ERP
        run: |
          docker rm -f ci-storefront-e2e 2>/dev/null || true
          docker run --rm --network "$STAGING_NETWORK" --name ci-storefront-e2e \
            -v /root/ERP:/work -w /work/storefront \
            -v /root/.cache/ms-playwright:/root/.cache/ms-playwright \
            -v /root/.npm-ci-cache:/root/.npm \
            --env-file backend/.env \
            --env-file storefront/.env \
            -e DATABASE_URL=postgres://medusa:medusa@db:5432/medusa?sslmode=disable \
            -e BASE_URL=http://web:3000 \
            -e BACKEND_URL=http://backend:9000 \
            -e CI=true \
            node:20-bookworm-slim \
            bash -c 'export ADMIN_EMAIL="$MEDUSA_ADMIN_EMAIL" ADMIN_PASSWORD="$MEDUSA_ADMIN_PASSWORD"; npm ci && npx playwright install --with-deps chromium && npm run test:e2e'

      # Must run before "Tear down staging" removes the containers. Only the
      # backend/web services matter here — db's logs are just SQL noise, and
      # backend-init/pos already log inline in their own steps.
      - name: Dump staging container logs (on failure)
        if: failure()
        working-directory: /root/ERP
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: |
          echo "::group::backend logs"
          docker compose --project-name erp-staging -f docker-compose.staging.yml logs backend || true
          echo "::endgroup::"
          echo "::group::web logs"
          docker compose --project-name erp-staging -f docker-compose.staging.yml logs web || true
          echo "::endgroup::"

      - name: Tear down staging
        if: always()
        working-directory: /root/ERP
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: docker compose --project-name erp-staging -f docker-compose.staging.yml down -v

      - name: Promote validated images to prod
        id: promote
        working-directory: /root/ERP
        run: ./scripts/promote-to-prod.sh "$TAG"

      - name: Validate infrastructure
        working-directory: /root/ERP
        run: ./scripts/infra-healthcheck.sh

      - name: Run production smoke tests
        working-directory: /root/ERP
        run: ./scripts/production-smoke.sh

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_number }}
          path: /root/ERP/.artifacts/playwright-production
          if-no-files-found: ignore
          retention-days: 7

      - name: Roll back prod (post-deploy verification failed)
        if: failure() && steps.promote.outcome == 'success'
        working-directory: /root/ERP
        run: ./scripts/rollback-prod.sh
