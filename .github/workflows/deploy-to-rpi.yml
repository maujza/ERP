name: Deploy to RPI on push to main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, erp] 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Pull latest changes on RPI
        run: |
          cd /root/ERP
          git reset --hard
          git pull
          ./scripts/compose-up.sh
      - name: Validate infrastructure
        run: |
          cd /root/ERP
          ./scripts/infra-healthcheck.sh
      - name: Run production smoke tests
        run: |
          cd /root/ERP
          ./scripts/production-smoke.sh
          echo "Repositorio actualizado y validado"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_number }}
          path: /root/ERP/.artifacts/playwright-production
          if-no-files-found: ignore
          retention-days: 7
